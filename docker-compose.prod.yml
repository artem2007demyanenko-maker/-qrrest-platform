# Production compose: app + db + nginx. Only nginx exposes 80/443.
# Usage: cp .env.production.example .env.production && edit .env.production
#        docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  # Все переменные из .env.production (в т.ч. APP_URL, APP_PROTOCOL, APP_MAIN_DOMAIN,
  # APP_COOKIE_DOMAIN, APP_HSTS*) попадают в контейнер через env_file — дублировать их в environment не нужно.
  app:
    build: .
    env_file: .env.production
    environment:
      - APP_RUNTIME=docker
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-qr_rest}
      - DB_USER=${DB_USER:-qr}
      - DB_PASS=${DB_PASS:-qrpass}
      - REDIS_HOST=${REDIS_HOST:-}
    volumes:
      - ./:/var/www/html
      - storage_logs:/var/www/html/storage/logs
      - backups_data:/var/www/html/backups
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
    # No ports: only nginx talks to app

  db:
    image: mysql:8.0
    env_file: .env.production
    environment:
      MYSQL_DATABASE: ${DB_NAME:-qr_rest}
      MYSQL_USER: ${DB_USER:-qr}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - dbdata_prod:/var/lib/mysql
    # Expose only to app/nginx host, not to host machine in prod (no ports)
    restart: unless-stopped

  # TLS: deploy/nginx/certs/{fullchain.pem,privkey.pem} — см. docs/DEPLOY_HTTPS.md
  # Поддомены: пока нет wildcard в сертификате, отдельный server с ssl_reject_handshake (см. default.conf).
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/certbot:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dbdata_prod:
  storage_logs:
  backups_data:
