# Nginx reverse proxy — production (docker-compose.prod.yml).
# Сертификаты: deploy/nginx/certs/fullchain.pem и privkey.pem (см. docs/DEPLOY_HTTPS.md).
# Ожидается fullchain с SAN: apex, www и *.MAIN_DOMAIN (Let’s Encrypt DNS-01 wildcard).
#
upstream app_backend {
    server app:80;
    keepalive 32;
}

# HTTP: ACME webroot + редирект на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name qrrest-menu.ru www.qrrest-menu.ru *.qrrest-menu.ru;

    location = /hash.php { return 410; }
    location = /wp-login.php { return 404; }
    location = /xmlrpc.php { return 404; }
    location = /.env { return 404; }
    location ^~ /.git/ { return 404; }
    location ^~ /vendor/ { return 404; }
    location ^~ /phpunit/ { return 404; }
    location ^~ /owa/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location ^~ /wordpress/ { return 404; }
    location ^~ /wp-admin/ { return 404; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: apex + www + поддомены ресторанов (один и тот же fullchain с wildcard в SAN)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qrrest-menu.ru www.qrrest-menu.ru *.qrrest-menu.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS на edge — опционально; основной заголовок из PHP (см. APP_HSTS*):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 32m;

    location = /hash.php { return 410; }
    location = /wp-login.php { return 404; }
    location = /xmlrpc.php { return 404; }
    location = /.env { return 404; }
    location ^~ /.git/ { return 404; }
    location ^~ /vendor/ { return 404; }
    location ^~ /phpunit/ { return 404; }
    location ^~ /owa/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location ^~ /wordpress/ { return 404; }
    location ^~ /wp-admin/ { return 404; }

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
