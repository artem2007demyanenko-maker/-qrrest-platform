# Nginx reverse proxy — production (docker-compose.prod.yml).
# Сертификаты: deploy/nginx/certs/fullchain.pem и privkey.pem (см. docs/DEPLOY_HTTPS.md).
#
# Два режима для поддоменов *.MAIN_DOMAIN:
#   • Сертификат только apex+www — блок «reject» ниже НЕ отдаёт чужой сертификат поддоменам (Nginx 1.19.4+).
#   • После DNS-01 wildcard — удалите блок reject и добавьте *.домен в основной server_name (один fullchain).
#
upstream app_backend {
    server app:80;
    keepalive 32;
}

# HTTP: ACME webroot + редирект на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name qrrest-menu.ru www.qrrest-menu.ru *.qrrest-menu.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: основной домен + www (fullchain должен покрывать эти имена в SAN)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qrrest-menu.ru www.qrrest-menu.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS на edge — опционально; основной заголовок из PHP (см. APP_HSTS*):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 32m;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# HTTPS: поддомены ресторанов — пока нет wildcard в fullchain.pem
# ssl_reject_handshake on не отправляет сертификат apex клиенту → нет «ложного» совпадения имён.
# После выпуска сертификата с *.qrrest-menu.ru: удалите этот server{} и добавьте *.qrrest-menu.ru
# в server_name первого HTTPS-блока (тот же ssl_certificate).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.qrrest-menu.ru;
    ssl_reject_handshake on;
}
